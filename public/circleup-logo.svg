<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B8BFF" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#004AD8" />
    </linearGradient>

    <!-- White Ring Soft Gradient / Specular -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8EEFA" />
    </linearGradient>

    <!-- Center Circle Gradient -->
    <linearGradient id="centerCircleGrad" x1="20%" y1="15%" x2="80%" y2="85%">
      <stop offset="0%" stop-color="#30A0FF" />
      <stop offset="60%" stop-color="#0077FE" />
      <stop offset="100%" stop-color="#005CD6" />
    </linearGradient>

    <!-- Satellite Orb Radial 3D Highlight -->
    <radialGradient id="orbGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#72D4FF" />
      <stop offset="45%" stop-color="#1B90FF" />
      <stop offset="85%" stop-color="#0062E4" />
      <stop offset="100%" stop-color="#0047BA" />
    </radialGradient>

    <!-- Soft Drop Shadow for the White Arc -->
    <filter id="arcShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#002D80" flood-opacity="0.28" />
    </filter>

    <!-- Soft Shadow for Orb -->
    <filter id="orbShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#002D80" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- App Icon Squircle Background -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" />

  <!-- Center Core Circle -->
  <circle cx="256" cy="256" r="78" fill="url(#centerCircleGrad)" />

  <!-- Outer White Arc "C" -->
  <!-- Sweeps counter-clockwise from ~12 deg (398, 226) around 330 deg to ~68 deg (302, 124) -->
  <path
    d="M 398 228 A 142 142 0 1 1 306 124"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="66"
    stroke-linecap="round"
    filter="url(#arcShadow)"
  />

  <!-- Floating Satellite Orb -->
  <circle cx="368" cy="158" r="34" fill="url(#orbGrad)" filter="url(#orbShadow)" />
</svg>
